<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagens dinâmicas</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador.</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem flexível">
    </picture>

    <h1>Reproduzindo Áudios em HTML5.</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5.</p>
    <audio preload="metadata" autoplay controls>
        <source src="midia/event horizon-thegreyroom.mp3" type="audio/mpeg">
        <source src="midia/event horizon-thegreyroom.ogg" type="audio/ogg">
        <source src="midia/event horizon-thegreyroom.wav" type="audio/wav">
        <p>Infelizmente seu navegador não consegue reproduzir áudio. <a href="midia/event horizon-thegreyroom.mp3">Clique aqui para baixar o arquivo MP3</a></p>
    </audio>

    <h1>Teste de dowload</h1>
    <p>Baixe essa música  <a href="midia/event horizon-thegreyroom.zip" download="event horizon-thegreyroom.zip" type="application/zip">aqui</a></p>
</body>
</html>
