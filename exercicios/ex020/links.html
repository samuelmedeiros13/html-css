<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: darkred;
        }

        a:hover {
            color: black;
            text-decoration: underline;
        }

        a:active {
            color: yellow;
        }

        .especial {
            background-color: rgba(255, 0, 0, 0.425);
        }

        .especial::before {
            content: '⏭︎';
        }

        .especial::after {
            content: '⏮︎';
        }

    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://tiosam.carrd.co/">Home</a></li>
        <li><a href="https://tiosam13commission.carrd.co/" class="especial">Commission</a></li>
        <li><a href="https://gallerytiosam13.carrd.co/" class="especial">Gallery</a></li>
    </ul>
</body>
</html>
